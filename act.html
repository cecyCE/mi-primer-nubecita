<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            color: #ffffff;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 3rem 4rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>¡Hola, Mundo!</h1>
        <p>Bienvenido a tu aplicación web</p>
    </div>

</body>
</html>
